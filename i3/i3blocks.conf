#
# Configures the i3blocks status bar.

# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=~/dotfiles/i3blocks-contrib/$BLOCK_NAME/$BLOCK_NAME
separator_block_width=12
markup=none

# Shows the volume. The first parameter sets the step and the units to
# display. The second parameter overrides the mixer selection. The script
# describes both.
#[volume]
#label=♪
#instance=Master
#interval=1
#signal=10
#color=#7F9F7F

# Shows the memory usage. The type defaults to "mem" if the instance is not
# specified.
[memory]
label=
interval=30
color=#7F9F7F

# Shows the disk usage. The directory defaults to $HOME if the instance is not
# specified. An optional script argument sets the alert threshold, which
# defaults to 10%.
[disk]
label=
interval=30
color=#7F9F7F

# Monitors the network interface. Without an instance, the block uses the
# interface of the default route.
# The address can be forced to IPv4 or IPv6 with -4 or -6 switches.
[iface]
color=#7F9F7F
interval=30

[iface-pub]
command=~/.i3/country.rb
color=#7F9F7F
interval=60

#[wifi]
#instance=wlp3s0
#interval=10
#separator=false

# Shows the battery level.
[battery]
interval=30
command=~/.i3/battery.py
color=#7F9F7F
markup=pango

[load_average]
interval=10

# Shows the temperature of multiple chips through lm-sensors. The script
# takes the -w and -c switches to set thresholds and describes them.
#[temperature]
#interval=10

# Shows the time in fuzzy words and the day of the month.
[time]
command=~/dotfiles/app/fuzzy_clock.py
interval=10

[time]
command=~/dotfiles/app/day_of_month.py
interval=60

# Supports generic media players. It displays "ARTIST - SONG" if music is
# playing.
# Supported players are: spotify, vlc, audacious, xmms2, mplayer, and others.
#[mediaplayer]
#instance=spotify
#interval=5
#signal=10

# Supports OpenVPN with multiple VPNs and colors.
#[openvpn]
#interval=20

# Shows the key indicators. The i3 config needs the following bindings:
#
# bindsym --release Caps_Lock exec pkill -SIGRTMIN+11 i3blocks
# bindsym --release Num_Lock  exec pkill -SIGRTMIN+11 i3blocks
#[keyindicator]
#instance=CAPS
#interval=once
#signal=11

#[keyindicator]
#instance=NUM
#interval=once
#signal=11
